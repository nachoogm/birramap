<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BirraMap · Diagnóstico</title>
<style>
  :root{--bg:#0b1b3a;--card:#132a55;--line:#22407a;--txt:#eaf0ff;--mut:#93a7cf;--ok:#39d98a;--bad:#ff6b7a;--gold:#f5b301}
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 20px;font-size:.9rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .step:last-child{border:none}
  .ico{font-size:1.3rem;width:28px;flex:none}
  .body{flex:1;min-width:0}
  .body b{display:block;margin-bottom:3px}
  .body div{color:var(--mut);font-size:.85rem;word-break:break-word}
  pre{background:#0a1428;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:.76rem;color:#a9c0ea}
  .hint{background:#20376b;border-left:4px solid var(--gold);border-radius:8px;padding:14px;font-size:.92rem;line-height:1.5}
  .big{font-size:1.15rem;font-weight:700;margin-bottom:10px}
  .ok{color:var(--ok)}.bad{color:var(--bad)}
  button,a.btn{display:inline-block;background:var(--gold);color:#26180a;border:none;border-radius:10px;
    padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
  a.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .loading{text-align:center;padding:40px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍺 BirraMap · Diagnóstico</h1>
  <p class="sub">Comprueba la configuración del servidor y de tu sesión.</p>
  <div id="out"><div class="loading">Comprobando…</div></div>
  <div style="margin-top:16px">
    <button onclick="run()">Volver a comprobar</button>
    <a class="btn ghost" href="/">Ir a la app</a>
    <a class="btn ghost" href="/.auth/login/github?post_login_redirect_uri=/diag.html">Iniciar sesión GitHub</a>
    <a class="btn ghost" href="/.auth/logout?post_logout_redirect_uri=/diag.html">Cerrar sesión</a>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pretty = d => typeof d === 'string' ? esc(d) : '<pre>' + esc(JSON.stringify(d, null, 2)) + '</pre>';

async function grab(url) {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const txt = await r.text();
    let body; try { body = JSON.parse(txt); } catch { body = txt.slice(0, 600); }
    return { status: r.status, ms: Date.now() - t0, body };
  } catch (e) { return { status: 0, ms: Date.now() - t0, body: 'No se pudo conectar: ' + e.message }; }
}

async function run() {
  $('#out').innerHTML = '<div class="loading">Comprobando…</div>';

  const auth = await grab('/.auth/me');
  const health = await grab('/api/health');
  const me = await grab('/api/me');

  const principal = auth.body && auth.body.clientPrincipal;
  let html = '';

  /* --- resumen --- */
  let veredicto, detalle;
  if (health.status === 404) {
    veredicto = '<span class="bad">La API no está desplegada</span>';
    detalle = 'La ruta /api/health devuelve 404. El workflow no ha subido la carpeta de Functions: revisa que <code>api_location</code> apunte a "/birra-map/api".';
  } else if (health.status === 0) {
    veredicto = '<span class="bad">Sin respuesta del servidor</span>';
    detalle = 'No se pudo contactar con /api/health.';
  } else if (health.body && health.body.ok === false) {
    veredicto = '<span class="bad">Hay un problema de configuración</span>';
    detalle = esc(health.body.hint || 'Mira los pasos de abajo.');
  } else if (me.status === 401) {
    veredicto = '<span class="ok">Servidor correcto</span> · sin sesión';
    detalle = 'Todo bien por detrás. Solo tienes que iniciar sesión.';
  } else if (me.status === 200) {
    veredicto = '<span class="ok">Todo funciona</span>';
    detalle = 'Servidor y sesión correctos. Puedes usar la app.';
  } else if (me.status === 500) {
    veredicto = '<span class="bad">La API falla al leer tu perfil</span>';
    detalle = 'El almacenamiento responde, pero /api/me da error. Mira el mensaje exacto abajo.';
  } else {
    veredicto = 'Estado ' + me.status;
    detalle = 'Revisa el detalle.';
  }

  html += `<div class="card"><div class="big">${veredicto}</div><div class="hint">${detalle}</div></div>`;

  /* --- sesión --- */
  html += `<div class="card"><div class="big">Tu sesión</div><div class="step">
    <div class="ico">${principal ? '✅' : '⬜'}</div><div class="body">
    <b>${principal ? 'Has iniciado sesión' : 'No has iniciado sesión'}</b>
    <div>${principal ? `Usuario: ${esc(principal.userDetails)} · Proveedor: ${esc(principal.identityProvider)}` : 'Usa uno de los botones de abajo para entrar.'}</div>
    </div></div></div>`;

  /* --- pasos del servidor --- */
  if (health.body && health.body.steps) {
    html += '<div class="card"><div class="big">Comprobaciones del servidor</div>';
    for (const [k, v] of Object.entries(health.body.steps)) {
      html += `<div class="step"><div class="ico">${v.ok ? '✅' : '❌'}</div>
        <div class="body"><b>${esc(k.replace(/^\d+-/, '').replace(/-/g, ' '))}</b><div>${pretty(v.detail)}</div></div></div>`;
    }
    html += `</div>`;
    if (health.body.runtime) html += `<div class="card"><div class="big">Entorno</div><pre>${esc(JSON.stringify(health.body.runtime, null, 2))}</pre></div>`;
  }

  /* --- respuestas en crudo --- */
  html += `<div class="card"><div class="big">Respuestas en crudo</div>
    <div class="step"><div class="ico">${health.status === 200 ? '✅' : '❌'}</div><div class="body">
      <b>GET /api/health → ${health.status} (${health.ms} ms)</b><div>${pretty(health.body)}</div></div></div>
    <div class="step"><div class="ico">${me.status === 200 ? '✅' : me.status === 401 ? '🔒' : '❌'}</div><div class="body">
      <b>GET /api/me → ${me.status} (${me.ms} ms)</b><div>${pretty(me.body)}</div></div></div>
  </div>`;

  $('#out').innerHTML = html;
}
run();
</script>
</body>
</html>
